# Configuration file for git-cliff (https://git-cliff.org)

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
    {% if commit.breaking %}[**breaking**] {% endif %}\
    {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/sepehrmoh81/native_display/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
{% if previous.version %}
**Full Changelog**: https://github.com/sepehrmoh81/native_display/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
footer = ""
trim = true

[git]
# Parse Conventional Commits (https://www.conventionalcommits.org)
conventional_commits = true
# Include non-conventional commits under "Other Changes" rather than discarding them
filter_unconventional = false
split_commits = false

# Parsers with numbered tags to preserve logical display order:
# Features -> Bug Fixes -> Refactoring -> Performance -> Documentation -> Styling -> Tests -> CI/Build -> Maintenance -> Other
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->♻️ Refactoring" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Tests" },
    { message = "^build", group = "<!-- 7 -->📦 Build System" },
    { message = "^ci", group = "<!-- 8 -->⚙️ CI / CD" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore", group = "<!-- 9 -->🧰 Maintenance" },
    { message = "^revert", group = "<!-- 10 -->🔄 Reverts" },
    { body = ".*", group = "<!-- 11 -->💼 Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
